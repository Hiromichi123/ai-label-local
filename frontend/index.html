<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOLO 本地标注台</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header><h1>YOLO 本地标注台</h1><span id="message">创建项目开始</span></header>
<main>
  <aside>
    <section><h2>项目</h2><select id="projectSelect"></select><button id="newProject">新建项目</button></section>
    <section><h2>图片</h2><input id="directory" type="file" webkitdirectory directory multiple accept="image/*,.txt"><button id="import">导入目录</button><div class="hint">必须选择目录；导入会替换当前项目内容；非方形图先确认永久裁剪，再标注。自动匹配同名 .txt。</div><div id="images"></div></section>
    <section><h2>类别</h2><div id="classes"></div><input id="newClass" placeholder="新增类别名称"><button id="addClass">新增类别</button></section>
    <section><h2>智能打标</h2><input id="model" placeholder="本地 .pt 或 .onnx 路径"><label>置信度 <input id="confidence" type="number" value="0.25" min="0" max="1" step="0.01"></label><button id="predict">预标注未标注图片</button><div id="job"></div></section>
    <section><h2>导出</h2><button id="export">导出已审核数据集</button></section>
  </aside>
  <section class="workspace"><div class="toolbar"><button id="addBox">新增框</button><button id="deleteBox">删除选中</button><button id="undo">撤销</button><button id="save">保存标注</button><label class="label-control" for="currentClass">当前标签 <select id="currentClass"></select></label><label class="zoom-control" for="zoomRange">缩放 <input id="zoomRange" type="range" min="25" max="200" step="5" value="35"><span id="zoomValue">35%</span></label><span id="selection">未选中</span><span id="saveStatus" class="save-status">未检查</span></div>
    <div id="cropPanel" class="crop-panel" hidden><strong>第 1 步：选择正方形识别区域</strong><span id="cropInfo"></span><label><span id="cropAxis"></span><input id="cropPosition" type="range" min="0" step="1"></label><button id="confirmCrop">确认并永久裁剪（Enter）→ 开始标注</button><span class="hint">拖动裁剪框或滑块移动。确认会永久重写工作图和标签；原始副本保留。</span></div>
    <div class="workspace-body"><div class="canvas-wrap"><canvas id="canvas"></canvas></div><aside class="box-panel"><h2>当前图片框</h2><div id="boxList" class="box-list"></div></aside></div></section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
