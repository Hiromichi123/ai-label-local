[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-label-studio-local"
version = "0.1.0"
description = "Local-first YOLO bounding-box dataset preparation and review UI"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pillow>=10,<12",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
pt = ["ultralytics>=8.3,<9"]
onnx = ["onnxruntime>=1.18,<2"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
yolo-label-studio = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
